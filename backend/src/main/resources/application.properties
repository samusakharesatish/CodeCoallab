spring.application.name=backend
spring.data.mongodb.uri=${MONGO_URI}
server.port=${PORT:8080}

jwt.secret=${JWT_SECRET}
jwt.expiration=${JWT_EXPIRATION:3600000}
jwt.refresh-expiration=${JWT_REFRESH_EXPIRATION:604800000}
cors.allowed-origins=${CORS_ALLOWED_ORIGINS}

# Code Execution API (Judge0)
judge0.api.url=${JUDGE0_API_URL}

# Redis Configuration (Upstash)
spring.data.redis.host=${REDIS_HOST:integral-mastodon-226061.upstash.io}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.password=${REDIS_PASSWORD:}
spring.data.redis.ssl.enabled=${REDIS_SSL:true}

# Email Service (Resend)
resend.api.key=${RESEND_API_KEY:}
resend.from.email=${RESEND_FROM_EMAIL:CodeCollab <onboarding@resend.dev>}